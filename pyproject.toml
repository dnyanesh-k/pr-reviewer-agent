[project]
name = "pr-reviewer-agent"
version = "0.1.0"
description = "PR reviewer agent for git"
requires-python = ">=3.10,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "openai-agents>=0.22.3",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
